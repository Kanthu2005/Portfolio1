<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="The Portfolio Depot — Interactive 3D shipping-container developer portfolio for Kanthu Naik, Software Developer and AI & Automation Enthusiast from Hyderabad, India." />
  <title>The Portfolio Depot — Kanthu Naik</title>

  <!-- Official Font Sources: Fontshare (Clash Display, Cabinet Grotesk) & Google Fonts (Instrument Serif Italic) -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=cabinet-grotesk@400,500,700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/containers.css" />
  <link rel="stylesheet" href="css/crane.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
  <!-- Screen-reader live region for crane & section announcements -->
  <div id="depot-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div class="depot-shell">
    <!-- =====================================================
         01. NAVIGATION BAR
         ===================================================== -->
    <header class="depot-nav" role="banner">
      <div class="nav-inner">
        <a href="#home" class="nav-logo" data-target="home" aria-label="Kanthu Naik — Return to Home container">
          <svg class="kn-wordmark" viewBox="0 0 112 36" width="112" height="36" fill="none"
            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1.5" y="1.5" width="33" height="33" rx="6" stroke="currentColor" stroke-width="2.2" />
            <path d="M10 10V26M10 18L17.5 10M13 15L18.5 26" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round" />
            <path d="M21 26V10L28 26V10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round" />
            <text x="43" y="16" fill="currentColor" font-family="Clash Display, sans-serif" font-weight="700"
              font-size="11" letter-spacing="0.06em">KANTHU</text>
            <text x="43" y="28" fill="rgba(255,255,255,0.78)" font-family="Cabinet Grotesk, sans-serif"
              font-weight="500" font-size="9.5" letter-spacing="0.12em">DEPOT</text>
          </svg>
        </a>

        <nav class="nav-links" aria-label="Primary portfolio sections">
          <button type="button" class="nav-link is-active" data-container="home" aria-current="page">Home</button>
          <button type="button" class="nav-link" data-container="projects">Projects</button>
          <button type="button" class="nav-link" data-container="about">About</button>
          <button type="button" class="nav-link" data-container="contact">Contact</button>
        </nav>

        <div class="nav-connect-wrap">
          <button type="button" class="nav-cta" id="nav-lets-connect" aria-haspopup="true" aria-expanded="false"
            aria-controls="nav-connect-menu">
            Let's Connect <span class="cta-arrow" aria-hidden="true">▾</span>
          </button>
          <div class="nav-connect-menu" id="nav-connect-menu" role="menu" hidden>
            <a class="nav-connect-item" role="menuitem" id="nav-connect-linkedin"
              href="https://linkedin.com/in/kanthu2005" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path
                  d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77Z" />
              </svg>
              <span>LinkedIn</span>
              <span class="connect-ext" aria-hidden="true">↗</span>
            </a>
            <a class="nav-connect-item" role="menuitem" id="nav-connect-email"
              href="mailto:naikkanthu2@gmail.com?subject=Portfolio%20Inquiry%20-%20Kanthu%20Naik">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              <span>Email</span>
              <span class="connect-ext" aria-hidden="true">↗</span>
            </a>
            <a class="nav-connect-item" role="menuitem" id="nav-connect-instagram"
              href="https://www.instagram.com/i_m_kanthu_18/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
              </svg>
              <span>Instagram</span>
              <span class="connect-ext" aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- =====================================================
         02. FULL-HEIGHT INTERACTIVE PORTFOLIO STAGE
         ===================================================== -->
    <main class="depot-stage" id="depot-stage" tabindex="-1">
      <!-- Subtle blueprint grid overlay -->
      <div class="stage-grid" aria-hidden="true"></div>

      <!-- Giant white backdrop word -->
      <div class="stage-backdrop-word" aria-hidden="true">PORTFOLIO</div>

      <!-- Robotic Crane System -->
      <div class="crane-system" id="crane-system" aria-hidden="true">
        <div class="crane-rail">
          <div class="crane-rail-track"></div>
        </div>
        <div class="crane-assembly" id="crane-assembly">
          <div class="crane-carriage">
            <span class="carriage-wheel wheel-left"></span>
            <span class="carriage-wheel wheel-right"></span>
            <span class="carriage-status-dot"></span>
          </div>
          <div class="crane-rod" id="crane-rod"></div>
          <div class="crane-grip-head" id="crane-grip-head">
            <span class="grip-bolt bolt-left"></span>
            <span class="grip-bolt bolt-right"></span>
            <div class="crane-spreader" id="crane-spreader">
              <div class="crane-finger finger-left">
                <div class="finger-arm"></div>
                <div class="finger-hook"></div>
              </div>
              <div class="crane-finger finger-right">
                <div class="finger-arm"></div>
                <div class="finger-hook"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3D Shipping Containers Mount Point -->
      <section class="containers-yard" id="containers-yard" aria-label="Interactive shipping containers">
        <!-- Populated dynamically by js/containers.js with real 3D cuboids and semantic buttons -->
      </section>

      <!-- Bottom Interaction Indicator -->
      <div class="stage-indicator" id="stage-indicator" aria-hidden="true">
        <span class="indicator-pill">PICK A CONTAINER ↓</span>
      </div>

      <!-- Toast Feedback (e.g. copy email, resume placeholder notice) -->
      <div class="depot-toast" id="depot-toast" role="status" aria-live="polite" hidden></div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/containers.js"></script>
  <script src="js/crane.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
